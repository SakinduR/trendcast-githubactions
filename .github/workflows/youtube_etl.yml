name: YouTube ETL Pipeline

on:
  # Schedule disabled 2026-09-24: this is the workflow file GitHub Actions
  # actually reads for this repo (root .github/workflows/), and it was still
  # firing on this schedule after youtube-etl-pipeline/.github/workflows/
  # was disabled -- that nested path isn't picked up by Actions at all, so
  # editing it earlier did nothing. This pipeline writes to a Supabase
  # project that has exhausted its free-tier quota and is being retired,
  # and Job 2 here (every 5 minutes) was still draining the shared YouTube
  # API key pool. Superseded by TrendCast-LK/trendcast-githubactions.
  # workflow_dispatch kept so this can still be run by hand if ever needed.
  # schedule:
  #   # Job 1 — Channel Ingestion: twice daily at minute 17 (avoiding top of the hour queue spikes)
  #   - cron: '17 */12 * * *'
  #   # Job 2 — Timeseries Collector: every 5 minutes (offset by 2 to avoid top-of-hour spikes)
  #   - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - job1_channel_ingestion
          - job2_timeseries_collector

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

jobs:
  # =========================================================================
  # Job 1 — Channel Ingestion (runs twice daily)
  # =========================================================================
  channel_ingestion:
    name: "Job 1 — Channel Ingestion"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'both' || github.event.inputs.job == 'job1_channel_ingestion'))
      || (github.event_name == 'schedule' && github.event.schedule == '17 */12 * * *')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install psycopg2-binary google-api-python-client

      - name: Run Channel Ingestion
        run: python youtube-etl-pipeline/youtube_extractor/job1_channel_ingestion.py

  # =========================================================================
  # Job 2 — Timeseries Collector (runs every 5 minutes)
  # =========================================================================
  timeseries_collector:
    name: "Job 2 — Timeseries Collector"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'both' || github.event.inputs.job == 'job2_timeseries_collector'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install psycopg2-binary google-api-python-client

      - name: Run Timeseries Collector
        run: python youtube-etl-pipeline/youtube_extractor/job2_timeseries_collector.py
